[package]
name = "Lan_tournament_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = "11.1.0"
mongodb = "3.9.1"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = "0.7.1"
tracing = "0.1.44"
urlencoding = "2.1.3"
