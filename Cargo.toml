[package]
name = "Lan_tournament_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
aws-config = "1.13.0"
aws-sdk-s3 = "1.156.0"
axum = { version = "0.8.9", features = ["ws",] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mongodb = "3.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "limit"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
